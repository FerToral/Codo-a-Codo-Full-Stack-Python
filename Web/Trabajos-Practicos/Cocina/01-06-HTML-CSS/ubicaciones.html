<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Plano de sedes de ejemplo</title>
    <style>
      body {
        margin: 0;
        padding: 22px;
        font: 16px/1.5 system-ui;
        background: #eff0e2;
        color: #273b2e;
      }
      h1 {
        font-size: 18px;
      }
      .plano {
        border-left: 5px solid #b7c4a9;
        padding-left: 20px;
        display: grid;
        gap: 18px;
      }
      article {
        padding: 6px 12px;
        border-bottom: 1px solid #b7c4a9;
      }
      article:target {
        background: #fff8d5;
        outline: 2px solid #a83a22;
      }
      h2 {
        font-size: 17px;
        margin: 0;
      }
      p {
        margin: 5px 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Plano esquemático · no está a escala</h1>
    <div class="plano">
      <article id="huerta">
        <h2>01 · La Huerta</h2>
        <p>Zona norte · ingredientes de estación.</p>
      </article>
      <article id="mercado">
        <h2>02 · El Mercado</h2>
        <p>Zona central · una mesa compartida.</p>
      </article>
      <article id="taller">
        <h2>03 · El Taller</h2>
        <p>Zona sur · recetas y encuentros.</p>
      </article>
    </div>
    <p>Sedes ficticias para una práctica de enlaces e iframes.</p>
  </body>
</html>
